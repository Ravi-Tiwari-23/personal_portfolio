{% if project.safe_live_url %}<a class="project-action project-action-primary" href="{{ project.safe_live_url }}" target="_blank" rel="noopener noreferrer" aria-label="Visit {{ project.title }} website, opens in a new tab" data-cursor="LIVE ↗">Visit website <span aria-hidden="true">↗</span></a>{% endif %}
{% if project.safe_github_url %}<a class="project-action" href="{{ project.safe_github_url }}" target="_blank" rel="noopener noreferrer" aria-label="View {{ project.title }} on GitHub, opens in a new tab" data-cursor="CODE ↗">GitHub <span aria-hidden="true">↗</span></a>{% endif %}
